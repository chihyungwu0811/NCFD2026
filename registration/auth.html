<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>會議註冊登入｜NCFD2026</title>
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="assets/css/registration.css">

</head>
<body>
<nav class="sitebar"><div class="container sitebar-inner">
<a class="brand" href="../index.html">2026 全國計算流體力學會議<small>National Computational Fluid Dynamics Conference</small></a>
<div class="navlinks" data-reg-nav></div>
</div></nav>

<header class="page-head"><div class="container"><h1>會議註冊帳號</h1><p>與投稿系統共用 Supabase 帳號；已有投稿帳號者請直接登入。</p></div></header>
<main class="content"><div class="container auth-shell"><div data-flash></div><div class="panel">
<div class="auth-tabs"><button id="login-tab" class="auth-tab active">登入</button><button id="signup-tab" class="auth-tab">建立帳號</button></div>
<div id="login-panel">
<form id="login-form" class="form-grid">
<div class="field full"><label>Email *</label><input name="email" type="email" required autocomplete="email"></div>
<div class="field full"><label>密碼 *</label><input name="password" type="password" required autocomplete="current-password"></div>
<div class="field full"><button class="btn btn-blue" type="submit">登入會議註冊系統</button></div>
</form><p class="small"><button id="forgot" class="btn btn-outline btn-sm" type="button">忘記密碼</button></p>
</div>
<div id="signup-panel" class="hidden">
<form id="signup-form" class="form-grid">
<div class="field"><label>中文姓名 *</label><input name="full_name_zh" required></div>
<div class="field"><label>服務單位 *</label><input name="affiliation" required></div>
<div class="field full"><label>Email *</label><input name="email" type="email" required></div>
<div class="field"><label>密碼 *</label><input name="password" type="password" minlength="8" required><span class="help">至少 8 個字元。</span></div>
<div class="field"><label>再次輸入密碼 *</label><input name="password2" type="password" minlength="8" required></div>
<div class="field full"><label class="checkbox-row"><input type="checkbox" name="privacy" value="1"><span>我已閱讀並同意 <a href="privacy.html" target="_blank" style="color:#145ba8;text-decoration:underline">個資與付款證明使用說明</a>。</span></label></div>
<div class="field full"><button class="btn btn-blue" type="submit">建立會議註冊帳號</button></div>
</form></div></div></div></main>

<footer><div class="container"><strong>NCFD2026 會議註冊系統</strong><div class="footer-note">聯絡信箱：<a href="mailto:NCFD2026@proton.me">NCFD2026@proton.me</a>｜<a href="../index.html">會議首頁</a></div></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../submission/assets/js/config.js"></script>
<script src="../submission/assets/js/client.js"></script>
<script src="assets/js/registration-common.js"></script>
<script src="assets/js/auth.js"></script>
</body></html>
