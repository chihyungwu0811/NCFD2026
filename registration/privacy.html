<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>個資與付款證明使用說明｜NCFD2026</title><link rel="stylesheet" href="assets/css/registration.css"></head><body><main class="content"><div class="container"><div class="panel"><h1>個資與付款證明使用說明</h1><p>本系統蒐集姓名、Email、服務單位、電話、參加資訊、收據資訊，以及您自願上傳之匯款／郵政劃撥付款證明，用於 NCFD2026 會議註冊、款項核對、報到、收據與必要聯繫。</p><p>付款證明存放於非公開的 Supabase Storage，僅本人及具管理權限之會議工作人員可依系統權限存取。付款證明可能包含金融交易資訊，請勿上傳與本次付款核對無關的額外敏感資料。</p><p>正式上線前，主辦單位應依實際個資政策、保存期間與法規要求確認本說明文字。</p><p><a class="btn btn-blue" href="auth.html">返回</a></p></div></div></main></body></html>
